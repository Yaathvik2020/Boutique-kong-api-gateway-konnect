name: oidc-debug
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    environment: global
    steps:
      - run: |
          python3 - <<'PY'
          import os, json, urllib.request, base64
          req = urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
                                       headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          p = json.load(urllib.request.urlopen(req))["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          print(json.dumps({k: c.get(k) for k in ["sub", "aud", "iss", "repository", "environment", "ref"]}, indent=2))
          PY
