# Node upgrades / drains never take a service below 1 running pod(s).
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: boutique
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: frontend }
---
apiVersion: policy/v1
