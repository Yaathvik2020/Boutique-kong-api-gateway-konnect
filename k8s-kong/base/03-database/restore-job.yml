# One-time Job: load boutique_full.sql (products, users ...) into the database:
#   dev            -> in-cluster Postgres (boutique-postgres)
#   staging / prod -> Amazon RDS (host, user, SSL from the boutique-secrets Secret)
#
# - Loads the dump only if one of the 5 databases (auth, boutique, orders, products, users)
#   is missing, so re-running it is harmless. Fails (not "Complete") if any is still missing.
# - Then ALWAYS applies the auth schema (idempotent): the dump's auth_db has no tables, but
#   auth (sign-up/login) and user-service (profile, addresses) need users, addresses and
#   user_preferences there. Fails if those tables are still missing afterwards.
# - Skips the dump's "CREATE/ALTER ROLE postgres" lines, so the dump can't
#   change the password from Secrets Manager.
# - "OWNER TO postgres" becomes "OWNER TO CURRENT_USER": on RDS the admin user
#   isn't called postgres.
# - Drops "LOCALE_PROVIDER = libc LOCALE = 'en_US.utf8'" from CREATE DATABASE: the dump
#   came from a Debian Postgres; the Alpine image doesn't have that locale, so every
#   CREATE DATABASE failed. The server default (UTF8) is used instead.
# - Pod label app=boutique-db-restore lets it through the Postgres NetworkPolicy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boutique-db-restore
  namespace: boutique
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boutique-db-restore
  namespace: boutique
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: boutique-db-restore
    spec:
      serviceAccountName: boutique-db-restore
      restartPolicy: OnFailure
      containers:
        - name: restore
          image: postgres:18-alpine
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: DB_HOST }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: DB_USER }
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: PGSSLMODE }
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: POSTGRES_PASSWORD }
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres..."
              until pg_isready; do sleep 2; done

              have=$(psql -tAc "SELECT count(*) FROM pg_database WHERE datname IN ('auth_db','boutique_db','orders_db','products_db','users_db')")
              if [ "$have" = "5" ]; then
                echo "All 5 databases exist, dump not loaded again."
              else
              echo "Loading dump..."
              grep -vE '^(CREATE|ALTER) ROLE' /dump/boutique_full.sql \
                | sed -e 's/OWNER TO postgres;/OWNER TO CURRENT_USER;/' \
                      -e "s/ LOCALE_PROVIDER = libc LOCALE = 'en_US.utf8'//" \
                | psql -v ON_ERROR_STOP=0 -d postgres

              # Fail the Job (instead of "Complete") if any database is still missing
              have=$(psql -tAc "SELECT count(*) FROM pg_database WHERE datname IN ('auth_db','boutique_db','orders_db','products_db','users_db')")
              psql -tAc "SELECT datname FROM pg_database WHERE datname LIKE '%_db' ORDER BY 1"
              if [ "$have" != "5" ]; then
                echo "ERROR: only $have of 5 databases were created. See the errors above." >&2
                exit 1
              fi
              fi

              echo "Applying auth schema to auth_db (safe to repeat)..."
              psql -v ON_ERROR_STOP=1 -d auth_db <<'SQL'
              CREATE TABLE IF NOT EXISTS users (
                  id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  email         VARCHAR(255) UNIQUE NOT NULL,
                  password_hash VARCHAR(255) NOT NULL,
                  first_name    VARCHAR(100),
                  last_name     VARCHAR(100),
                  role          VARCHAR(20) NOT NULL DEFAULT 'customer' CHECK (role IN ('customer', 'admin')),
                  created_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE TABLE IF NOT EXISTS addresses (
                  id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  user_id    UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  street     VARCHAR(255) NOT NULL,
                  city       VARCHAR(100) NOT NULL,
                  state      VARCHAR(100),
                  zip_code   VARCHAR(20),
                  country    VARCHAR(100) NOT NULL,
                  is_default BOOLEAN NOT NULL DEFAULT false,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX IF NOT EXISTS idx_addresses_user_id ON addresses(user_id);
              CREATE TABLE IF NOT EXISTS user_preferences (
                  user_id    UUID PRIMARY KEY REFERENCES users(id) ON DELETE CASCADE,
                  currency   VARCHAR(3)  NOT NULL DEFAULT 'USD',
                  language   VARCHAR(10) NOT NULL DEFAULT 'en',
                  newsletter BOOLEAN NOT NULL DEFAULT true,
                  promotions BOOLEAN NOT NULL DEFAULT true,
                  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE OR REPLACE FUNCTION update_updated_at_column() RETURNS TRIGGER AS $$
              BEGIN NEW.updated_at = CURRENT_TIMESTAMP; RETURN NEW; END;
              $$ LANGUAGE plpgsql;
              CREATE OR REPLACE TRIGGER update_users_updated_at
                  BEFORE UPDATE ON users FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
              SQL

              tables=$(psql -d auth_db -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','addresses','user_preferences')")
              if [ "$tables" != "3" ]; then
                echo "ERROR: auth_db has only $tables of 3 tables (users, addresses, user_preferences)." >&2
                exit 1
              fi
              echo "Done: 5 databases, auth_db tables ready."
          volumeMounts:
            - name: dump
              mountPath: /dump
      volumes:
        - name: dump
          configMap:
            name: boutique-db-dump      # created from boutique_full.sql by kustomization.yml
