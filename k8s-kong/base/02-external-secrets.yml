# Secrets come from AWS Secrets Manager, never from Git.
# Terraform (terraform-infra/modules/app-secrets) creates them per environment:
#   boutique/<env>/app                   -> Kubernetes Secret boutique/boutique-secrets
#   boutique/<env>/konnect-cluster-cert  -> Kubernetes Secret kong/kong-cluster-cert
# External Secrets reads them with its own IAM role (only boutique/<env>/*).
# The Redis password is NOT synced into Kubernetes: Kong reads it directly from
# Secrets Manager (boutique-<env>-kong-redis) with its own IAM role, see kong-config/boutique.yaml.
# The <env> part is set by each overlay (overlays/<env>/kustomization.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1           # same region as terraform-infra/envs/<env>
---
# DB URLs, DB password, JWT secrets -> same keys the services already read
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boutique-secrets
  namespace: boutique
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: boutique-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: boutique/ENV/app     # replaced by the overlay
---
# Kong data plane certificate for this env's Konnect control plane
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kong-cluster-cert
  namespace: kong
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: kong-cluster-cert
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: boutique/ENV/konnect-cluster-cert, property: crt }
    - secretKey: tls.key
      remoteRef: { key: boutique/ENV/konnect-cluster-cert, property: key }
