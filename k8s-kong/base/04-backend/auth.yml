# auth — login / register.  Public path: /api/auth/*  (via Kong)
# Called by: Kong only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth, version: v1 }
    spec:
      serviceAccountName: auth
      containers:
        - name: auth
          image: boutique/auth   # real registry + tag set per environment in overlays/<env>/kustomization.yaml
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: boutique-secrets, key: AUTH_DB_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: boutique
  labels: { app: auth }           # ServiceMonitor finds it by this label
spec:
  type: ClusterIP                 # private; only Kong is public
  selector: { app: auth }
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
# Headless Service for Kong: its DNS name returns one IP per Ready pod, so the
# Kong data planes balance and health-check each pod (kong-config/boutique.yaml).
apiVersion: v1
kind: Service
metadata:
  name: auth-pods
  namespace: boutique
spec:
  clusterIP: None
  selector: { app: auth }
  ports:
    - name: http
      port: 3002
      targetPort: 3002
