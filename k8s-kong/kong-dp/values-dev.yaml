# DEV data planes: 1 small pod. Konnect control plane "dev".
# Values marked TODO come from Konnect or from:  terraform -chdir=terraform-infra/envs/dev output
image:
  tag: "3.14.0.12"   # Kong Gateway 3.14 LTS (supported to 2029). If Konnect shows a newer 3.14.x patch, use that.

env:
  cluster_control_plane: "4db6049699.in.cp.konghq.com:443"
  cluster_server_name: "4db6049699.in.cp.konghq.com"
  cluster_telemetry_endpoint: "4db6049699.in.tp.konghq.com:443"
  cluster_telemetry_server_name: "4db6049699.in.tp.konghq.com"
  trusted_ips: "10.10.0.0/16"                                  # output vpc_cidr (the ALB lives in this VPC)

deployment:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::214920156606:role/boutique-dev-kong-dp   # output kong_dp_role_arn

proxy:
  ingress:
    hostname: ksys-dev.ksysglobaltech.online                                     # output api_url (Route 53 record via external-dns)
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: boutique-dev-edge
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:214920156606:certificate/efdde5b1-5200-451c-9693-0720fc1d7850"
      alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-east-1:214920156606:regional/webacl/boutique-dev-api/97407344-3459-4d52-a517-6a1ff3ece038"
      alb.ingress.kubernetes.io/load-balancer-attributes: >-
        deletion_protection.enabled=false,access_logs.s3.enabled=true,access_logs.s3.bucket=boutique-dev-alb-logs-214920156606,idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true

replicaCount: 2     # 2 pods: one restart or node change no longer takes the whole site down (ALB 503)
resources:
  # Kong Gateway Enterprise + Redis rate limiting + vault + Prometheus needs ~1 GiB under load.
  # 512Mi was too small: Kong crashed after a few hundred requests.
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { memory: 1Gi }
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # keep one Kong pod up during node drains
